name: Build IPA
on:
  push:
  workflow_dispatch:
defaults:
  run:
    working-directory: photo-app
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild -project PhotoShutter.xcodeproj -scheme PhotoShutter \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/PhotoShutter.app Payload/
          zip -r PhotoShutter.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: PhotoShutter-ipa
          path: photo-app/PhotoShutter.ipa
