name: PhotoShutter
options:
  bundleIdPrefix: com.ivetold
  deploymentTarget:
    iOS: "17.2"
targets:
  PhotoShutter:
    type: application
    platform: iOS
    sources: [PhotoShutter]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ivetold.photoshutter
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Фото"
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна для съёмки фото"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
