<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Фото</title>
<style>
:root{--bg:#101214;--panel:#1a1d20;--text:#e8e6e1;--muted:#8a8f94;--accent:#8fb8ff;--danger:#ff8a80}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:16px/1.4 -apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button,input{font:inherit}
#login{min-height:100%;display:grid;place-items:center;padding:24px}
#login form{width:100%;max-width:340px;display:grid;gap:12px}
#login h1{margin:0 0 8px;font-size:24px;font-weight:600}
input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid #2c3136;background:var(--panel);color:var(--text)}
input:focus,button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
details{color:var(--muted);font-size:14px}
summary{cursor:pointer;padding:4px 0}
details input{margin-top:8px}
.hint{margin-top:6px;font-size:13px}
.btn{padding:12px 14px;border-radius:10px;border:0;background:var(--accent);color:#0b1220;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:default}
.err{color:var(--danger);min-height:1.4em;font-size:14px}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:4px 10px;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:rgba(16,18,20,.92);backdrop-filter:blur(8px)}
header span{color:var(--muted);font-size:14px}
header input[type=range]{width:110px;padding:0;margin:0 4px;accent-color:var(--accent)}
.hbtns{display:flex;flex-wrap:wrap;align-items:center;gap:2px}
.zb{font-size:22px;padding:2px 14px}
.link{background:none;border:0;color:var(--accent);cursor:pointer;padding:6px}
.link:disabled{opacity:.4;cursor:default}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cell,110px),1fr));gap:2px;padding:0 0 env(safe-area-inset-bottom)}
#grid button{position:relative;padding:0;border:0;background:var(--panel);aspect-ratio:1;cursor:pointer}
#grid img{width:100%;height:100%;object-fit:cover;display:block}
#grid.selmode button:not(.sel)::after{content:"";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;border:2px solid #fff;background:rgba(0,0,0,.3)}
#grid button.sel::after{content:"✓";position:absolute;top:6px;right:6px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#0b1220;font-weight:700;font-size:14px;display:grid;place-items:center}
#grid button.sel img{opacity:.55}
#empty{padding:60px 24px;text-align:center;color:var(--muted)}
#lb{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column}
#stage{flex:1;position:relative;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
#stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform-origin:center;will-change:transform;-webkit-user-drag:none;pointer-events:none}
.bar{display:flex;justify-content:space-between;align-items:center;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;font-size:14px;color:var(--muted)}
.bar.bottom{padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;border-radius:10px;background:rgba(0,0,0,.45);color:#fff;font-size:26px;cursor:pointer}
#prev{left:8px}#next{right:8px}
@media (pointer:coarse){.nav{display:none}}
@media (prefers-reduced-motion:no-preference){#stage img.anim{transition:transform .2s}}
</style>
</head>
<body>

<section id="login" hidden>
  <form id="loginForm">
    <h1>Вход</h1>
    <input id="email" type="email" placeholder="Почта" autocomplete="username" required>
    <input id="password" type="password" placeholder="Пароль" autocomplete="current-password" required>
    <details id="srv">
      <summary>Свой сервер Supabase</summary>
      <input id="srvUrl" type="text" placeholder="Адрес проекта (https://…supabase.co)" autocapitalize="off" autocorrect="off" spellcheck="false">
      <input id="srvKey" type="text" placeholder="Публичный ключ (publishable или anon)" autocapitalize="off" autocorrect="off" spellcheck="false">
      <div class="hint">Оставьте пустым, чтобы использовать сервер по умолчанию.</div>
    </details>
    <div class="err" id="loginErr"></div>
    <button class="btn" id="loginBtn" type="submit">Войти</button>
  </form>
</section>

<section id="app" hidden>
  <header>
    <span id="count"></span>
    <input id="size" type="range" min="70" max="320" value="110" aria-label="Размер миниатюр">
    <div class="hbtns">
      <button class="link" id="selBtn">Выбрать</button>
      <button class="link" id="allBtn" hidden>Все</button>
      <button class="link" id="delSel" style="color:var(--danger)" hidden>Удалить</button>
      <button class="link" id="logout">Выйти</button>
    </div>
  </header>
  <div id="grid"></div>
  <div id="empty" hidden>Фото пока нет. Они появятся здесь, как только их снимут.</div>
</section>

<div id="lb" hidden>
  <div class="bar"><span id="counter"></span><button class="link" id="close">Закрыть</button></div>
  <div id="stage">
    <img id="lbimg" alt="">
    <button class="nav" id="prev" aria-label="Назад">‹</button>
    <button class="nav" id="next" aria-label="Вперёд">›</button>
  </div>
  <div class="bar bottom">
    <span id="when"></span>
    <span><button class="link zb" id="zout" aria-label="Уменьшить">−</button><button class="link zb" id="zin" aria-label="Увеличить">+</button></span>
    <button class="link" id="del" style="color:var(--danger)">Удалить</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const DEFAULT = {
  url: 'https://gisjcvenulyituqshdrz.supabase.co',
  key: 'sb_publishable_LVGjAvz7YWdtY5L7Cn0sRg_Uy2FN2kY'
};
const BUCKET = 'photos';
const $ = id => document.getElementById(id);

/* ---------- настройки сервера ---------- */
function loadCfg() {
  try {
    const c = JSON.parse(localStorage.getItem('sb_cfg') || 'null');
    if (c && c.url && c.key) return c;
  } catch (e) {}
  return { ...DEFAULT };
}
function saveCfg(c) {
  try {
    if (c.url === DEFAULT.url && c.key === DEFAULT.key) localStorage.removeItem('sb_cfg');
    else localStorage.setItem('sb_cfg', JSON.stringify(c));
  } catch (e) {}
}
function normUrl(s) {
  let t = s.trim();
  if (!t) return '';
  if (!/^https?:\/\//i.test(t)) t = 'https://' + t;
  return t.replace(/\/+$/, '');
}

let cfg = loadCfg();
let sb = null, authSub = null, channel = null;
let photos = [];   // {id, path, created_at, url}
let cur = 0;
let selMode = false;
const sel = new Set();

if (cfg.url !== DEFAULT.url || cfg.key !== DEFAULT.key) {
  $('srvUrl').value = cfg.url;
  $('srvKey').value = cfg.key;
  $('srv').open = true;
}

function connect(url, key) {
  if (authSub) authSub.unsubscribe();
  sb = supabase.createClient(url, key);
  const { data } = sb.auth.onAuthStateChange((_ev, session) => { session ? start() : stop(); });
  authSub = data.subscription;
  sb.auth.getSession().then(({ data }) => { if (!data.session) stop(); });
}

/* ---------- вход ---------- */
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  $('loginErr').textContent = '';
  const u = normUrl($('srvUrl').value);
  const k = $('srvKey').value.trim();
  const want = (u && k) ? { url: u, key: k } : { ...DEFAULT };
  const prev = cfg;
  const changed = want.url !== cfg.url || want.key !== cfg.key;
  $('loginBtn').disabled = true;
  try {
    if (changed) { cfg = want; connect(cfg.url, cfg.key); }
    const { error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('password').value });
    if (error) throw error;
    saveCfg(cfg);
  } catch (err) {
    $('loginErr').textContent = 'Не удалось войти. Проверьте почту, пароль и адрес сервера.';
    if (changed) { cfg = prev; connect(cfg.url, cfg.key); }
  }
  $('loginBtn').disabled = false;
});
$('logout').onclick = () => sb.auth.signOut();

function stop() {
  if (channel) { channel.unsubscribe(); channel = null; }
  photos = [];
  sel.clear();
  selMode = false;
  closeLb();
  $('app').hidden = true;
  $('login').hidden = false;
}

async function start() {
  $('login').hidden = true;
  $('app').hidden = false;
  await load();
  if (!channel) {
    channel = sb.channel('photos-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'photos' }, async p => {
        if (photos.some(x => x.id === p.new.id)) return;
        const url = await sign(p.new.path);
        photos.unshift({ ...p.new, url });
        render();
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'photos' }, p => {
        photos = photos.filter(x => x.id !== p.old.id);
        render();
      })
      .subscribe();
  }
}

async function sign(path) {
  const { data } = await sb.storage.from(BUCKET).createSignedUrl(path, 3600);
  return data ? data.signedUrl : '';
}

async function load() {
  const { data, error } = await sb.from('photos').select('*').order('created_at', { ascending: false }).limit(500);
  if (error) { $('count').textContent = 'Ошибка загрузки'; return; }
  const paths = data.map(r => r.path);
  const urls = {};
  if (paths.length) {
    const res = await sb.storage.from(BUCKET).createSignedUrls(paths, 3600);
    (res.data || []).forEach(r => { urls[r.path] = r.signedUrl; });
  }
  photos = data.map(r => ({ ...r, url: urls[r.path] || '' }));
  render();
}

/* ---------- сетка и выбор ---------- */
function updateHeader() {
  $('count').textContent = selMode ? 'Выбрано: ' + sel.size : (photos.length ? 'Фото: ' + photos.length : '');
  $('selBtn').textContent = selMode ? 'Отмена' : 'Выбрать';
  $('selBtn').hidden = photos.length === 0 && !selMode;
  $('allBtn').hidden = !selMode;
  $('allBtn').textContent = (photos.length && sel.size === photos.length) ? 'Снять' : 'Все';
  $('delSel').hidden = !selMode;
  $('delSel').textContent = 'Удалить (' + sel.size + ')';
  $('delSel').disabled = sel.size === 0;
}

function render() {
  const g = $('grid');
  g.textContent = '';
  g.classList.toggle('selmode', selMode);
  for (const id of [...sel]) if (!photos.some(p => p.id === id)) sel.delete(id);
  photos.forEach((p, i) => {
    const b = document.createElement('button');
    if (sel.has(p.id)) b.className = 'sel';
    b.setAttribute('aria-label', 'Фото ' + (i + 1));
    const img = document.createElement('img');
    img.loading = 'lazy'; img.src = p.url; img.alt = '';
    b.appendChild(img);
    b.onclick = () => {
      if (selMode) {
        sel.has(p.id) ? sel.delete(p.id) : sel.add(p.id);
        b.classList.toggle('sel', sel.has(p.id));
        updateHeader();
      } else {
        openLb(i);
      }
    };
    g.appendChild(b);
  });
  $('empty').hidden = photos.length > 0;
  updateHeader();
  if (!$('lb').hidden) { if (!photos.length) closeLb(); else show(Math.min(cur, photos.length - 1)); }
}

$('selBtn').onclick = () => { selMode = !selMode; sel.clear(); render(); };
$('allBtn').onclick = () => {
  if (photos.length && sel.size === photos.length) sel.clear();
  else photos.forEach(p => sel.add(p.id));
  render();
};
$('delSel').onclick = async () => {
  const chosen = photos.filter(p => sel.has(p.id));
  if (!chosen.length) return;
  if (!confirm('Удалить выбранные фото (' + chosen.length + ')? Это нельзя отменить.')) return;
  $('delSel').disabled = true;
  const r1 = await sb.storage.from(BUCKET).remove(chosen.map(p => p.path));
  const r2 = await sb.from('photos').delete().in('id', chosen.map(p => p.id));
  if (r1.error || r2.error) {
    alert('Не все фото удалось удалить.');
    await load();
  } else {
    const ids = new Set(chosen.map(p => p.id));
    photos = photos.filter(p => !ids.has(p.id));
  }
  sel.clear();
  selMode = false;
  render();
};

/* размер миниатюр */
const sizeEl = $('size');
try { const v = localStorage.getItem('cell'); if (v) sizeEl.value = v; } catch (e) {}
const setCell = () => {
  document.documentElement.style.setProperty('--cell', sizeEl.value + 'px');
  try { localStorage.setItem('cell', sizeEl.value); } catch (e) {}
};
sizeEl.addEventListener('input', setCell);
setCell();

/* ---------- просмотр ---------- */
const stage = $('stage'), img = $('lbimg');
let scale = 1, tx = 0, ty = 0;
const apply = () => { img.style.transform = `translate(${tx}px,${ty}px) scale(${scale})`; };
const reset = (anim) => { img.classList.toggle('anim', !!anim); scale = 1; tx = 0; ty = 0; apply(); };
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

function openLb(i) { $('lb').hidden = false; document.body.style.overflow = 'hidden'; show(i); }
function closeLb() { $('lb').hidden = true; document.body.style.overflow = ''; }
function show(i) {
  cur = (i + photos.length) % photos.length;
  const p = photos[cur];
  reset(false);
  img.src = p.url;
  $('counter').textContent = (cur + 1) + ' из ' + photos.length;
  $('when').textContent = new Date(p.created_at).toLocaleString('ru-RU');
  [cur + 1, cur - 1].forEach(j => { const q = photos[(j + photos.length) % photos.length]; if (q) new Image().src = q.url; });
}
const go = d => show(cur + d);

$('close').onclick = closeLb;
$('prev').onclick = () => go(-1);
$('next').onclick = () => go(1);
document.addEventListener('keydown', e => {
  if ($('lb').hidden) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') go(-1);
  if (e.key === 'ArrowRight') go(1);
});

$('del').onclick = async () => {
  const p = photos[cur];
  if (!p || !confirm('Удалить это фото?')) return;
  await sb.storage.from(BUCKET).remove([p.path]);
  const { error } = await sb.from('photos').delete().eq('id', p.id);
  if (error) { alert('Не удалось удалить.'); return; }
  photos = photos.filter(x => x.id !== p.id);
  render();
};

function zoomBy(f) {
  img.classList.add('anim');
  scale = clamp(scale * f, 1, 6);
  if (scale === 1) { tx = 0; ty = 0; }
  apply();
}
$('zin').onclick = () => zoomBy(1.5);
$('zout').onclick = () => zoomBy(1 / 1.5);

/* жесты: щипок, перетаскивание, свайп, двойной тап, колесо */
const pts = new Map();
let startDist = 0, startScale = 1, sx = 0, sy = 0, stx = 0, sty = 0, downX = null, downT = 0, lastTap = 0, moved = 0;

stage.addEventListener('pointerdown', e => {
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  img.classList.remove('anim');
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    startDist = Math.hypot(a.x - b.x, a.y - b.y); startScale = scale; downX = null;
  } else {
    sx = e.clientX; sy = e.clientY; stx = tx; sty = ty; downX = e.clientX; downT = Date.now(); moved = 0;
  }
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) {
    const [a, b] = [...pts.values()];
    scale = clamp(startScale * Math.hypot(a.x - b.x, a.y - b.y) / startDist, 1, 6); apply();
  } else if (scale > 1) {
    tx = stx + e.clientX - sx; ty = sty + e.clientY - sy; apply();
  }
  moved = Math.max(moved, Math.abs(e.clientX - sx) + Math.abs(e.clientY - sy));
});
function endPtr(e) {
  const was = pts.size;
  pts.delete(e.pointerId);
  if (pts.size === 1) {
    const p = [...pts.values()][0]; sx = p.x; sy = p.y; stx = tx; sty = ty; downX = null;
  }
  if (was === 1) {
    if (scale <= 1.02) {
      reset(true);
      const dx = downX === null ? 0 : e.clientX - downX;
      if (Math.abs(dx) > 60) { go(dx < 0 ? 1 : -1); return; }
    }
    if (moved < 10 && Date.now() - downT < 300) {
      const now = Date.now();
      if (now - lastTap < 300) { toggleZoom(e); lastTap = 0; } else lastTap = now;
    }
  }
}
stage.addEventListener('pointerup', endPtr);
stage.addEventListener('pointercancel', endPtr);

function toggleZoom(e) {
  img.classList.add('anim');
  if (scale > 1) { reset(true); return; }
  const r = stage.getBoundingClientRect();
  scale = 2.5;
  tx = (r.width / 2 - (e.clientX - r.left)) * (scale - 1);
  ty = (r.height / 2 - (e.clientY - r.top)) * (scale - 1);
  apply();
}
stage.addEventListener('wheel', e => {
  e.preventDefault();
  scale = clamp(scale * (e.deltaY < 0 ? 1.15 : 1 / 1.15), 1, 6);
  if (scale === 1) { tx = 0; ty = 0; }
  apply();
}, { passive: false });

connect(cfg.url, cfg.key);
</script>
</body>
</html>
